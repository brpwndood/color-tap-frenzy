                </button>

                {/* AdMob Banner Placeholder */}
                <a href="https://play.google.com/store/apps/details?id=com.mobeesoft.colortapfrenzy" target="_blank" rel="noopener noreferrer" className="mt-6 w-full h-16 bg-gray-700 bg-opacity-50 rounded-lg flex items-center justify-center text-gray-300 text-sm border border-gray-600 hover:bg-gray-600 transition-colors duration-200">
                  Rate, Review & Share!
                </a>
              </div>
              {/* Message Box */}
              {isMessageBoxVisible && (
                <div className="message-box show">
                  {currentMessage}
                </div>
              )}

              {/* Game Over Overlay */}
             {/* --- MODIFIED Game Over Overlay --- */}
      {gameOverData && (
  <div className="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-20 p-4">
    <div className="bg-white bg-opacity-90 backdrop-blur-md rounded-2xl p-8 shadow-2xl text-center text-gray-800 max-w-sm w-full border border-white border-opacity-40">
      
      <h2 className="text-5xl font-extrabold text-red-600 mb-4 drop-shadow-lg">GAME OVER!</h2>
      
       <p className="text-3xl font-bold mb-3">Final Score: {gameOverData.finalScore}</p>
      
        

  
        
        {gameOverData.finalScore > gameOverData.scoreToBeat ? (
        
        <form onSubmit={handleSubmitScore} className="mt-6">
          <h3 className="text-xl font-semibold text-gray-700 mb-3">Enter your name for the leaderboard!</h3>
          <input
            type="text"
            placeholder="Your Name"
            value={playerName}
            onChange={(e) => setPlayerName(e.target.value)}
            maxLength="15"
            className="w-full px-4 py-2 mb-4 text-gray-800 bg-gray-200 rounded-lg border-2 border-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
          />
          <button
            type="submit"
            className="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-full shadow-lg transform transition duration-300 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-green-400"
          >
            Submit Score
          </button>
        </form>
      ) 
       
      : (

        <p className="text-xl font-semibold mb-6">Try again to beat {gameOverData.scoreToBeat} to get on the LEADERBOARD!</p>

      )}
      {/* --- End of conditional part --- */} 

      {/* The "Play Again" button can always be visible */}
      <button
        className="mt-4 bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded-full shadow-lg transform transition duration-300 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-purple-400"
        onClick={startGame} // Assumes startGame is defined in your App component
      >
        Play Again
      </button>

    </div>
  </div>
)}
               <Leaderboard refreshKey={leaderboardKey} />
            </div>
             
          );
        };

        // Render the App component into the root div
        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<>
          <App />
          {/* QR Code Placeholder at the bottom */}
          <div className="w-full flex justify-center mt-8">
            <div className="bg-white bg-opacity-80 rounded-lg p-4 shadow-lg flex flex-col items-center" style={{ width: '180px', height: '180px' }}>
              <span className="text-gray-700 text-lg font-semibold mb-2">Share with QR</span>
              <div className="w-32 h-32 bg-gray-300 flex items-center justify-center rounded">
               <img
  src="/ctfqr.png"
  alt="QR Code"
  className="w-32 h-32 object-contain rounded"
/>
              </div>
            </div>
          </div>
        </>);</script></body></html>
